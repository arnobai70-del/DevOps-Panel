name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The app runs on Electron's Node and BoringSSL, not the system Node: run the suite there too.
      - name: Tests on Electron's runtime
        run: npx electron node_modules/vitest/vitest.mjs run
        env:
          ELECTRON_RUN_AS_NODE: '1'
      - run: npm run build

  installer:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win -- --publish never
        env:
          # Google sign-in client, built into the installer; kept only in the repository's Actions secrets.
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: AgencyProjectVault-Setup
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
